<style>
:root{
  --red:#E2231A; --black:#232324; --glass:#33414B; --glass2:#5B6B76; --concrete:#B8B4AC;
  --mesh:#F3F1EC; --paper:#FFFFFF; --ink:#1E1F21; --muted:#6B6E73; --line:#DDD9D1; --soft:#ECE9E3;
  --z:1; --desk:#D9D6D0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#1B1B1D}}
:root[data-theme="dark"]{--desk:#1B1B1D}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--desk);color:var(--ink);font-family:"Noto Sans Georgian",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* ---------- navigation ---------- */
#nav{position:fixed;inset:0 auto 0 0;width:232px;background:var(--black);color:#fff;padding:22px 18px;display:flex;flex-direction:column;gap:18px;z-index:20}
#nav .brand{font-weight:800;font-size:17px;letter-spacing:.2px;line-height:1.2}
#nav .brand small{display:block;font-weight:400;font-size:11px;color:#A8A7A3;margin-top:4px}
#nav .brand i{display:inline-block;width:10px;height:10px;background:var(--red);margin-right:7px;transform:rotate(45deg) translateY(-1px)}
#nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#nav li a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;text-decoration:none;color:#D8D6D1;font-size:14px}
#nav li a span{font-size:11px;color:#77756F;width:14px}
#nav li a:hover{background:#2F2F31;color:#fff}
#nav li a.on{background:#fff;color:var(--black);font-weight:600}
#nav li a.on span{color:var(--red)}
.search{position:relative}
.search input{width:100%;padding:9px 10px 9px 32px;border-radius:6px;border:1px solid #444;background:#2B2B2D;color:#fff;font:inherit;font-size:13px}
.search input::placeholder{color:#8B8984}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.search .msg{font-size:11px;color:#FF8A80;margin-top:4px;min-height:14px}
#nav .foot{margin-top:auto;font-size:11px;color:#8B8984}
#nav .foot button{all:unset;cursor:pointer;display:block;margin-top:8px;padding:7px 10px;border:1px solid #555;border-radius:6px;color:#fff;text-align:center}
#nav .foot button:hover{border-color:#fff}
main{margin-left:232px;padding:28px 24px 60px;display:flex;flex-direction:column;align-items:center;gap:26px}
/* ---------- page (A4 landscape @96dpi = 1123×794) ---------- */
.page{position:relative;width:1123px;height:794px;background:var(--paper);overflow:hidden;zoom:var(--z);box-shadow:0 2px 14px rgba(0,0,0,.12);padding:36px 44px 44px;counter-increment:pg;display:flex;flex-direction:column}
.page.flow{height:auto;min-height:794px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}
.kick{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--red)}
.ph h2{margin:2px 0 0;font-size:26px;font-weight:700;line-height:1.15}
.ph .side{text-align:right;color:var(--muted);font-size:12px}
.pfoot{position:absolute;left:44px;right:44px;bottom:16px;display:flex;justify-content:space-between;font-size:10px;color:#9A9892;border-top:1px solid var(--line);padding-top:6px}
.pfoot::after{content:counter(pg)}
.lead{font-size:15px;color:#3A3B3E;max-width:720px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 80%,#000);border:1px solid color-mix(in srgb,var(--c) 30%,#fff);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.lg{font-size:13px;padding:5px 12px 5px 9px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--black);color:#fff}
.tag.red{background:var(--red)}
.warn{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;background:#FFF1D6;color:#8A5A00}
/* ---------- plans ---------- */
svg.plan{display:block;width:100%;height:auto}
svg text{font-family:"Noto Sans Georgian",sans-serif}
.fp{fill:#F6F4F0;stroke:#9C988F;stroke-width:1.2px;vector-effect:non-scaling-stroke}
.axl{stroke:#B9C3CC;stroke-width:.6px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.axb{fill:#fff;stroke:#7D8B97;stroke-width:.8px;vector-effect:non-scaling-stroke}
.axt{fill:#55626D;font-size:1.25px;text-anchor:middle;dominant-baseline:central}
.u rect.ur{stroke:#fff;stroke-width:1.4px;vector-effect:non-scaling-stroke;transition:opacity .15s}
.u.int{cursor:pointer}
.u.int:hover rect.ur{filter:brightness(1.12)}
.u.dim{opacity:.16}
.ut{font-size:1.9px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.um{font-size:1.35px;fill:#fff;text-anchor:middle;dominant-baseline:central;opacity:.92;pointer-events:none}
.ut.dk,.um.dk{fill:#2A2B2D}
.ft{font-size:1.25px;text-anchor:middle;dominant-baseline:central;fill:#5E5B55;pointer-events:none}
.ft.w{fill:#fff;font-weight:700;font-size:1.7px}
.k-core{fill:var(--black)}
.k-lobby{fill:#F6D2CE;stroke:var(--red);stroke-width:1.2px;vector-effect:non-scaling-stroke}
.k-shaft{fill:var(--black)}
.k-terrace{fill:url(#hatch);stroke:#8F9A6E;stroke-width:.8px;vector-effect:non-scaling-stroke}
.k-passage{fill:#E9E6E0}
.k-foyer{fill:#E3DED5;stroke:#C8C2B6;stroke-width:.6px;vector-effect:non-scaling-stroke}
.k-void{fill:url(#cross)}
.k-stair{fill:url(#stair)}
.k-roof{fill:url(#dots)}
.hl rect.ur{stroke:#fff}
/* furniture */
.f-zone{fill:#ECE9E3;stroke:#B9B4AA;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-wet{fill:#DCE7EE;stroke:#8EA6B5;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-furn{fill:#fff;stroke:#3A3B3E;stroke-width:.8px;vector-effect:non-scaling-stroke}
.f-eq{fill:#5D6770;stroke:none}
.f-tbl{fill:#fff;stroke:#3A3B3E;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-chair{fill:#C9C4BA}
.f-desk{fill:#fff;stroke:#4B4D51;stroke-width:.5px;vector-effect:non-scaling-stroke}
.f-room-kit{fill:#F3E6D2;stroke:#B79C70;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-room-srv{fill:#D9DDE1;stroke:#7E8891;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-room-meet{fill:#DDE6EC;stroke:#6F8796;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-room-mgr{fill:#EAE6F0;stroke:#8B80A0;stroke-width:.7px;vector-effect:non-scaling-stroke}
.f-room-rec{fill:var(--red)}
.f-red{fill:var(--red)}
.fl{fill:#3A3B3E;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ufl{fill:#fff;stroke:var(--black);stroke-width:2.2px;vector-effect:non-scaling-stroke}
.glz{stroke:#4F7EA3;stroke-width:4px;vector-effect:non-scaling-stroke}
.dimt{font-size:.62px;fill:#6B6E73;text-anchor:middle;dominant-baseline:central}
.diml{stroke:#9A9892;stroke-width:.6px;vector-effect:non-scaling-stroke}
/* legend / filters */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:#4A4B4E}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{all:unset;cursor:pointer;font-size:12px;padding:5px 11px 5px 9px;border-radius:99px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;background:#fff}
.filters button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.filters button.on{background:var(--black);color:#fff;border-color:var(--black)}
.filters button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.halfl{font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin:6px 0 2px}
#tip{position:fixed;pointer-events:none;background:var(--black);color:#fff;padding:8px 11px;border-radius:6px;font-size:12px;line-height:1.35;z-index:50;opacity:0;transform:translateY(4px);transition:opacity .1s;max-width:260px}
#tip.on{opacity:1}
#tip b{font-size:14px}
/* image slots */
.slot{position:relative;margin:0;aspect-ratio:16/9;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.slot .ill{position:absolute;inset:0}
.slot .ill svg{width:100%;height:100%;display:block}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot figcaption{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;align-items:center;font-size:10.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.slot figcaption code{font-family:ui-monospace,Menlo,monospace;font-size:10px;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:3px;text-shadow:none}
.slot.photo{border:0}
.slot.photo figcaption{justify-content:flex-start}
/* facts */
.facts{display:grid;grid-template-columns:auto 1fr;gap:0;font-size:13px;border-top:1px solid var(--line)}
.facts dt,.facts dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);padding-right:14px;white-space:nowrap}
.facts dd{font-weight:600}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.5px}
.big small{font-size:18px;font-weight:600;margin-left:3px}
.why{background:var(--mesh);border-left:3px solid var(--red);padding:9px 12px;font-size:12.5px;border-radius:0 6px 6px 0}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--soft);border-radius:6px;padding:6px 10px;font-size:12px}
.stat b{display:block;font-size:16px}
/* cards */
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:16px;line-height:1.25}
.card .area{font-size:28px;font-weight:800;line-height:1;white-space:nowrap}
.card .area small{font-size:13px;font-weight:600}
.card .units{display:flex;flex-wrap:wrap;gap:4px}
.card .units a{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--soft);text-decoration:none;font-weight:600}
.card .units a:hover{background:var(--black);color:#fff}
.card.offer{border-top:4px solid var(--red)}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.kv b{color:var(--ink);font-size:14px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--mesh);border-radius:8px;padding:14px 16px}
.tile b{display:block;font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.3px}
.tile b small{font-size:14px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.tile.dark{background:var(--black);color:#fff}.tile.dark span{color:#B6B4AE}
.tile.red{background:var(--red);color:#fff}.tile.red span{color:#FFD9D6}
/* table */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
th.sort{cursor:pointer;user-select:none}
th.sort::after{content:" ↕";color:#BBB}
th.sort.asc::after{content:" ↑";color:var(--red)}
th.sort.desc::after{content:" ↓";color:var(--red)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--mesh);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
td a{text-decoration:none;font-weight:600}
td a:hover{color:var(--red)}
/* cover */
.cover{padding:0;color:#fff;background:var(--black)}
.cover .bg{position:absolute;inset:0}
.cover .bg img,.cover .bg svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,20,22,.88) 0%,rgba(20,20,22,.55) 45%,rgba(20,20,22,0) 75%)}
.cover .in{position:relative;padding:60px 64px;height:100%;display:flex;flex-direction:column}
.cover h1{font-size:64px;line-height:1.02;margin:18px 0 12px;font-weight:800;letter-spacing:-1px;max-width:600px}
.cover .sub{font-size:19px;color:#E4E2DD;max-width:480px}

}

<script>
(function(){
"use strict";
const M = DATA.meta, P = DATA.profiles, AX = DATA.grid.axes, D = DATA.grid.depth;
const U = Object.fromEntries(DATA.units.map(u => [u.id, u]));
const CORE = Object.fromEntries(DATA.cores.map(c => [c.id, c]));
const LV = {1: "±0.00", 2: "+4.00", 3: "+8.00", 4: "+12.00"};
const FLOORNAME = {1: "კომერციული სართული", 2: "მე-2 სართული", 3: "მე-3 სართული", 4: "მე-4 სართული"};
const comm = DATA.units.filter(u => u.floor === 1);
const offices = DATA.units.filter(u => u.floor > 1);

/* ---------- helpers ---------- */
const fmt = (n, d) => { const v = d === undefined ? (Math.round(n * 10) / 10) : +n.toFixed(d);
  const [i, f] = String(v).split("."); return i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (f ? "." + f : ""); };
const r1 = n => Math.round(n * 100) / 100;
function X(a){ if (a <= 1) return AX[1] - (1 - a) * 4.7; if (a >= 35) return AX[35];
  const i = Math.floor(a), f = a - i; return AX[i] + f * (AX[i + 1] - AX[i]); }
function rectsOf(u){ const sh = u.shape || [[u.axes[0], u.axes[1], 0, D]];
  return sh.map(s => ({ x: X(s[0]), y: s[2], w: X(s[1]) - X(s[0]), h: s[3] - s[2] })); }
const biggest = rs => rs.slice().sort((a, b) => b.w * b.h - a.w * a.h)[0];
const sum = (ids) => r1(ids.reduce((s, id) => s + U[id].m2, 0));
const coreMid = id => (X(CORE[id].axes[0]) + X(CORE[id].axes[1])) / 2;
const chip = (p, lg) => `<span class="chip${lg ? " lg" : ""}" style="--c:${P[p].color}">${P[p].name}</span>`;
const frontage = u => r1(rectsOf(u).filter(r => Math.abs(r.y + r.h - D) < .01).reduce((s, r) => s + r.w, 0));
const unitLink = id => `<a href="#u-${id}">${id}</a>`;
const head = (cnt) => `${Math.round(cnt / 10)}–${Math.round(cnt / 8)}`;
const pfoot = (t) => `<div class="pfoot"><span>${M.name} · ${t}</span></div>`;
function page(inner, o = {}){ return `<section class="page ${o.cls || ""}" ${o.id ? `id="${o.id}"` : ""} data-sec="${o.sec || ""}">${inner}${o.nofoot ? "" : pfoot(o.foot || "")}</section>`; }
function ph(kick, title, side){ return `<div class="ph"><div><div class="kick">${kick}</div><h2>${title}</h2></div>${side ? `<div class="side">${side}</div>` : ""}</div>`; }

/* ---------- plan SVG ---------- */
const ROOMLEG = `<span class="legend" style="font-size:10.5px;text-transform:none;letter-spacing:0">${[["#F3E6D2","სამზარეულო"],["#DDE6EC","შეხვედრა"],["#EAE6F0","მენეჯერი"],["#D9DDE1","სერვერი"],["#E2231A","მიღება"]].map(([c,l]) => `<span><i class="sw" style="background:${c};border:1px solid #9AA"></i>${l}</span>`).join("")}</span>`;
const OFFCLR = m => m >= 450 ? "#4E5E69" : m >= 300 ? "#8597A3" : "#B9C5CC";
function planSVG(floor, o = {}){
  const vx0 = o.vx0 ?? -6.5, vx1 = o.vx1 ?? 231, axes = o.axes !== false;
  const vy0 = o.vy0 ?? (axes ? -4.4 : -1), vy1 = o.vy1 ?? 16.4;
  let s = `<svg class="plan ${o.cls || ""}" viewBox="${vx0} ${vy0} ${r1(vx1 - vx0)} ${r1(vy1 - vy0)}" role="img" aria-label="${FLOORNAME[floor]} — გეგმა">`;
  s += `<rect class="fp" x="0" y="0" width="${AX[35]}" height="${D}"/>`;
  if (axes){
    for (let i = 1; i <= 35; i++) s += `<line class="axl" x1="${AX[i]}" x2="${AX[i]}" y1="-1.7" y2="${D + .6}"/>`;
    for (let i = 1; i <= 35; i++){
      if (DATA.grid.joints.includes(i - 1)) continue;
      const j = DATA.grid.joints.includes(i);
      const x = j ? (AX[i] + AX[i + 1]) / 2 : AX[i];
      if (x < vx0 || x > vx1) continue;
      s += `<circle class="axb" cx="${x}" cy="-2.9" r="${j ? 1.55 : 1.25}"/><text class="axt" x="${x}" y="-2.85" ${j ? 'style="font-size:1px"' : ""}>${j ? i + "/" + (i + 1) : i}</text>`;
    }
  }
  const fs = DATA.features.filter(f => f.floor === floor);
  const under = fs.filter(f => ["terrace", "passage", "void", "roof", "stair", "foyer"].includes(f.kind) && !(f.kind === "foyer" && floor > 2));
  const over = fs.filter(f => !under.includes(f));
  const feat = f => {
    const x = X(f.x[0]), w = X(f.x[1]) - x, y = f.y[0], h = f.y[1] - f.y[0];
    let t = `<rect class="k-${f.kind}" x="${r1(x)}" y="${y}" width="${r1(w)}" height="${r1(h)}"/>`;
    const lab = f.kind === "core" ? f.core : (f.label || "");
    if (o.labels !== false && lab && (w > 1.4 || f.kind === "core") && (!o.lay || f.kind === "core" || f.kind === "lobby")){
      const cls = (f.kind === "core" || f.kind === "shaft") ? "ft w" : "ft";
      const vertical = f.kind !== "core" && h > w && lab.length * .66 > w;
      t += `<text class="${cls}" x="${r1(x + w / 2)}" y="${r1(y + h / 2)}" ${vertical ? `transform="rotate(-90 ${r1(x + w / 2)} ${r1(y + h / 2)})"` : ""}>${lab}</text>`;
    }
    return t;
  };
  s += under.map(feat).join("");
  for (const u of DATA.units.filter(u => u.floor === floor)){
    const rs = rectsOf(u), b = biggest(rs);
    const hl = o.hl ? o.hl.includes(u.id) : null;
    const fill = hl === null ? (o.fill ? o.fill(u) : (floor === 1 ? P[u.profiles[0]].color : OFFCLR(u.m2))) : (hl ? (o.lay ? "#FCF1EF" : "var(--red)") : "#E2DED6");
    const dark = hl === false || (hl === null && floor > 1 && u.m2 < 300) || (hl && o.lay);
    s += `<g class="u${o.interactive ? " int" : ""}${hl ? " hl" : ""}" data-id="${u.id}" data-p="${(u.profiles || []).join(" ")}" ${o.interactive ? `tabindex="0" role="link" aria-label="${u.id}, ${fmt(u.m2)} მ²"` : ""}>`;
    s += rs.map(r => `<rect class="ur" x="${r1(r.x)}" y="${r.y}" width="${r1(r.w)}" height="${r.h}" fill="${fill}"${hl && o.lay ? ' style="stroke:var(--red);stroke-width:2px"' : ""}/>`).join("");
    if (o.band && hl === null && u.profiles && u.profiles[1])
      s += `<rect x="${r1(b.x + .35)}" y=".35" width="${r1(b.w - .7)}" height="1.1" fill="${P[u.profiles[1]].color}" stroke="#fff" stroke-width=".2"/>`;
    if (o.labels !== false && hl && o.lay){
      s += `<text class="ut dk" x="${r1(b.x + .4)}" y="-.75" style="text-anchor:start;font-size:1.3px;fill:var(--red)">${u.id}</text>`;
    } else if (o.labels !== false){
      const cx = r1(b.x + b.w / 2), cy = b.y + b.h / 2;
      const small = b.w < 6;
      s += `<text class="ut${dark ? " dk" : ""}" x="${cx}" y="${r1(cy - (o.m2 === false ? 0 : 1))}" ${small ? 'style="font-size:1.5px"' : ""}>${u.id}</text>`;
      if (o.m2 !== false) s += `<text class="um${dark ? " dk" : ""}" x="${cx}" y="${r1(cy + 1.2)}">${fmt(u.m2)} მ²</text>`;
    }
    s += `</g>`;
  }
  s += over.map(feat).join("");
  if (o.extra) s += o.extra;
  if (axes && o.rows !== false && vx1 > AX[35] + 1)
    [["A", 0], ["B", DATA.grid.rowB], ["C", D]].forEach(([l, y]) => s += `<text class="axt" x="${AX[35] + 2.2}" y="${y}">${l}</text>`);
  return s + `</svg>`;
}
const SPLIT = 113.6;
function splitPlan(floor, o = {}){
  return `<div class="halfl">დასავლეთი · ღერძები 1–18</div>${planSVG(floor, { ...o, vx0: -6.5, vx1: SPLIT + 1.5 })}
          <div class="halfl">აღმოსავლეთი · ღერძები 18–35</div>${planSVG(floor, { ...o, vx0: SPLIT - 2.5, vx1: 231.5 })}`;
}
const miniPlan = (floor, hl) => planSVG(floor, { hl, axes: false, labels: false, vy0: -.6, vy1: (floor === 2 || floor > 2) ? 15.6 : 13.2, cls: "mini" });

/* ---------- commercial fit-out generators (local metres; y = 0 back wall, y = H shopfront) ---------- */
function mk(){ const e = []; return { e,
  R: (x, y, w, h, c, l, fs) => e.push({ t: "r", x, y, w, h, c, l, fs }),
  C: (x, y, r, c) => e.push({ t: "c", x, y, r, c: c || "chair" }) }; }
function seating(k, x0, y0, w, h, big, skipCenter){
  const px = big ? 2.6 : 2.0, py = big ? 2.6 : 1.9;
  const cols = Math.floor((w - .6) / px + 1e-6), rows = Math.floor(h / py + 1e-6); let seats = 0;
  const ox = x0 + (w - cols * px) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const cx = ox + c * px + px / 2, cy = y0 + r * py + py / 2;
    if (skipCenter && r === rows - 1 && Math.abs(cx - (x0 + w / 2)) < 1.2) continue;
    if (big){ k.R(cx - .45, cy - .45, .9, .9, "tbl"); [[-.8, 0], [.8, 0], [0, -.8], [0, .8]].forEach(([a, b]) => k.C(cx + a, cy + b, .26)); seats += 4; }
    else { k.R(cx - .35, cy - .35, .7, .7, "tbl"); k.C(cx - .62, cy, .24); k.C(cx + .62, cy, .24); seats += 2; }
  }
  return seats;
}
const FIT = {
  food(W, H, u){ const k = mk(), kd = 3.4;
    k.R(0, 0, W - 2.4, kd, "zone", "სამზარეულო"); k.R(W - 2.4, 0, 2.4, kd, "wet", "WC");
    const cw = Math.min(W - 1.6, 5.4); k.R(.8, kd + .7, cw, .8, "furn", "ბარი / დახლი");
    for (let i = 0; i < Math.floor(cw / .9); i++) k.C(1.25 + i * .9, kd + 1.95, .22);
    const seats = seating(k, 0, kd + 2.6, W, H - kd - 3.4, W >= 11, true);
    const st = [["ადგილი შიგნით", "≈ " + seats]];
    if (u.terrace) st.push(["ადგილი ტერასაზე", "≈ " + Math.floor(u.terrace.m2 / 1.5)]);
    st.push(["სამზარეულო", "≈ " + Math.round((W - 2.4) * kd) + " მ²"]);
    return { e: k.e, st, seats }; },
  market(W, H){ const k = mk();
    k.R(0, 0, W - 2.4, 2.6, "zone", "საწყობი"); k.R(W - 2.4, 0, 2.4, 2.6, "wet", "WC");
    k.R(.3, 2.9, W - .6, .8, "eq"); k.R(0, 4.3, .6, H - 7.6, "furn"); k.R(W - .6, 4.3, .6, H - 7.6, "furn");
    let n = 0; for (let x = 2.0; x + .9 <= W - 2.0; x += 2.3){ k.R(x, 4.8, .9, H - 9.0, "furn"); n++; }
    k.R(.8, H - 2.7, 2.2, .8, "furn", "სალარო", .34); if (W > 9) k.R(3.4, H - 2.7, 2.2, .8, "furn", "სალარო", .34);
    return { e: k.e, st: [["სტელაჟის რიგი", n + 2], ["სალარო", W > 9 ? 2 : 1], ["სამაცივრე კედელი", r1(W - .6) + " მ"]] }; },
  beauty(W, H){ const k = mk();
    k.R(0, 0, W - 2.4, 2.6, "zone", "პერსონალი / საწყობი", .36); k.R(W - 2.4, 0, 2.4, 2.6, "wet", "WC");
    const nw = Math.min(3, Math.floor((W - 1) / 1.4)); for (let i = 0; i < nw; i++) k.R(.6 + i * 1.4, 3.0, 1.0, 1.5, "wet");
    let ch = 0; for (let y = 5.4; y + 1.1 <= H - 3.0; y += 1.55){ k.R(0, y, .16, 1.1, "eq"); k.C(.95, y + .55, .36); ch++;
      if (W >= 7){ k.R(W - .16, y, .16, 1.1, "eq"); k.C(W - .95, y + .55, .36); ch++; } }
    k.R(W - 2.8, H - 2.2, 2.0, .7, "furn", "მიღება", .34); k.R(.5, H - 1.5, 2.4, .7, "furn", "მოსაცდელი", .3);
    return { e: k.e, st: [["სავარძელი", ch], ["თავის დაბანა", nw], ["მიღება + მოსაცდელი", "✓"]] }; },
  health(W, H){ const k = mk(); const cw = (W - 1.6) / 2, top = H - 3.8; let n = 0;
    const per = Math.max(1, Math.floor(top / 3.2)), rh = top / per;
    for (let i = 0; i < per; i++){
      const y = i * rh;
      if (i === 0){ k.R(0, 0, cw, rh, "wet", "WC / სტერ.", .32); }
      else { k.R(0, y, cw, rh, "zone", "კაბ. " + (++n), .36); k.R(.5, y + rh / 2 - .35, 1.6, .7, "eq"); }
      k.R(W - cw, y, cw, rh, "zone", "კაბ. " + (++n), .36); k.R(W - cw + .5, y + rh / 2 - .35, 1.6, .7, "eq");
    }
    k.R(W / 2 - 1.3, H - 2.6, 2.6, .7, "furn", "რეგისტრატურა", .32);
    for (let i = 0; i < 4; i++) k.C(.8 + i * .7, H - 1.1, .26);
    return { e: k.e, st: [["კაბინეტი", n], ["რეგისტრატურა + მოსაცდელი", "✓"], ["სანიტარიული/სტერილ.", "✓"]] }; },
  bank(W, H){ const k = mk();
    k.R(0, 0, 2.2, 3.0, "wet", "WC"); k.R(2.2, 0, W - 4.8, 3.0, "zone", "ბექ-ოფისი", .4); k.R(W - 2.6, 0, 2.6, 3.0, "eq", "", 0);
    k.e.push({ t: "x", x: W - 1.3, y: 1.5, l: "სეიფი" });
    const n = Math.max(2, Math.floor((W - 1.6) / 1.9)); k.R(.8, 4.2, W - 1.6, .8, "furn", "ოპერატორები", .34);
    for (let i = 0; i < n; i++) k.C(1.75 + i * ((W - 1.9) / n), 3.75, .26);
    k.R(.8, 6.6, 1.6, .8, "furn"); k.R(.8, 8.6, 1.6, .8, "furn"); k.C(2.8, 7.0, .26); k.C(2.8, 9.0, .26);
    k.R(W - 2.6, H - 2.6, 2.6, 2.6, "zone", "24/7 ATM", .34);
    for (let i = 0; i < 3; i++) k.C(W / 2 - .2 + i * .7, 7.6, .26);
    return { e: k.e, st: [["ოპერატორი", n], ["კონსულტანტი", 2], ["ATM ვესტიბიული", "✓"]] }; },
  retail(W, H){ const k = mk();
    k.R(0, 0, W - 2.4, 2.6, "zone", "საწყობი"); k.R(W - 2.4, 0, 2.4, 2.6, "wet", "WC");

const rows = [
  ...offices.map(u => ({ name: u.id, href: "#u-" + u.id, type: "ოფისი", units: u.id, fl: LV[u.floor], m2: u.m2 })),
  ...OC.map(c => ({ name: c.name, href: "#o-" + c.id, type: { block: "ბლოკი", floor: "სართული", stack: "ვერტიკალი", mixed: "შერეული" }[c.type], units: c.units.join(" + "), fl: floorsOf(c), m2: sum(c.units) }))
];
const tb = document.querySelector("#sumt tbody");
function renderT(rs){ tb.innerHTML = rs.map(r => `<tr><td><a href="${r.href}">${r.name}</a></td><td>${r.type}</td><td class="small">${r.units}</td><td class="small">${r.fl}</td><td class="num"><b>${fmt(r.m2)}</b></td><td class="num">${head(r.m2)}</td></tr>`).join(""); }
renderT(rows);
document.querySelectorAll("#sumt th.sort").forEach(th => th.addEventListener("click", () => {
  const k = th.dataset.k, asc = !th.classList.contains("asc");
  document.querySelectorAll("#sumt th.sort").forEach(t => t.classList.remove("asc", "desc")); th.classList.add(asc ? "asc" : "desc");
  const coll = new Intl.Collator("ka", { numeric: true });
  renderT(rows.slice().sort((a, b) => (k === "m2" ? a.m2 - b.m2 : coll.compare(a.name, b.name)) * (asc ? 1 : -1)));
}));

/* scale pages to viewport */
const mainEl = document.getElementById("main");
function fit(){ const w = mainEl.clientWidth - 48; document.documentElement.style.setProperty("--z", innerWidth <= 860 ? 1 : Math.min(1, w / 1123).toFixed(4)); }
addEventListener("resize", fit); fit();
addEventListener("beforeprint", () => document.documentElement.style.setProperty("--z", 1));
addEventListener("afterprint", fit);

/* active nav */
const links = [...document.querySelectorAll("#nav li a")];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ const s = e.target.dataset.sec; links.forEach(a => a.classList.toggle("on", a.dataset.s === s)); } }), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll(".page[data-sec]").forEach(p => io.observe(p));
})();
</script>
</body>
</html>
